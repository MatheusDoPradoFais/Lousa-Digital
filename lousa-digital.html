<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Lousa Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=Pacifico&family=Architects+Daughter&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="frame">
  <div class="label-row">
    <div class="label" id="boardLabel" contenteditable="true" spellcheck="false" title="Clique para renomear a lousa">lousa</div>
    <div class="label-tools">
      <select id="labelFont" title="Fonte do título">
        <option value="'Caveat', cursive">Cursiva</option>
        <option value="'Pacifico', cursive">Assinatura</option>
        <option value="'Architects Daughter', cursive">Manuscrita</option>
        <option value="'Poppins', sans-serif">Moderna</option>
        <option value="Georgia, serif">Clássica</option>
        <option value="'Courier New', monospace">Máquina</option>
      </select>
      <button class="ttbtn" id="labelAlignBtn" title="Alinhamento do título (clique para alternar)">⟸</button>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="boardBg"></canvas>
    <canvas id="board"></canvas>
    <div id="textLayer"></div>
    <div class="text-toolbar" id="textToolbar">
      <select id="ttFont">
        <option value="'Caveat', cursive">Cursiva</option>
        <option value="'Inter', sans-serif">Moderna</option>
        <option value="Georgia, serif">Clássica</option>
        <option value="'Courier New', monospace">Máquina</option>
      </select>
      <input type="range" id="ttSize" min="14" max="72" value="28" title="Tamanho da letra">
      <button class="ttbtn" id="ttBold" title="Negrito">B</button>
      <button class="ttbtn" id="ttItalic" title="Itálico" style="font-style:italic;">I</button>
      <button class="ttbtn" id="ttUnderline" title="Sublinhado" style="text-decoration:underline;">U</button>
      <button class="ttbtn" id="ttStrike" title="Tachado" style="text-decoration:line-through;">T</button>
      <button class="ttbtn" id="ttAlign" title="Alinhamento (clique para alternar)">⟸</button>
      <div class="tt-sep"></div>
      <button class="tt-color" data-color="#f6f3e6" style="background:#f6f3e6" title="Texto branco"></button>
      <button class="tt-color" data-color="#eec96a" style="background:#eec96a" title="Texto amarelo"></button>
      <button class="tt-color" data-color="#e78fa3" style="background:#e78fa3" title="Texto rosa"></button>
      <button class="tt-color" data-color="#89bcdc" style="background:#89bcdc" title="Texto azul"></button>
      <button class="tt-color" data-color="#8fceac" style="background:#8fceac" title="Texto verde"></button>
      <button class="tt-color" data-color="#e8a15c" style="background:#e8a15c" title="Texto laranja"></button>
      <button class="tt-color" data-color="#b48be0" style="background:#b48be0" title="Texto roxo"></button>
      <button class="tt-color" data-color="#232323" style="background:#232323" title="Texto preto"></button>
      <div class="hex-wrap" title="Cor de texto personalizada (hexadecimal)">
        <input type="color" id="ttColorPicker" class="color-picker-native" value="#f6f3e6" tabindex="-1">
        <input type="text" id="ttColorHex" class="hex-input" placeholder="#RRGGBB" maxlength="7" spellcheck="false">
      </div>
      <div class="tt-sep"></div>
      <button class="tt-bg" data-bg="" title="Sem destaque">∅</button>
      <button class="tt-bg" data-bg="rgba(255,224,90,0.55)" style="background:rgba(255,224,90,0.55)" title="Destaque amarelo"></button>
      <button class="tt-bg" data-bg="rgba(255,255,255,0.32)" style="background:rgba(255,255,255,0.32)" title="Destaque branco"></button>
      <button class="tt-bg" data-bg="rgba(137,188,220,0.4)" style="background:rgba(137,188,220,0.4)" title="Destaque azul"></button>
      <div class="tt-sep"></div>
      <button class="ttbtn trash" id="ttDelete" title="Excluir caixa">✕</button>
    </div>
  </div>

  <div class="tray">
    <div class="tray-groove"></div>

    <div class="group" id="chalkGroup">
      <button class="chalk active" data-color="#f6f3e6" style="--c:#f6f3e6" title="Giz branco"></button>
      <button class="chalk" data-color="#eec96a" style="--c:#eec96a" title="Giz amarelo"></button>
      <button class="chalk" data-color="#e78fa3" style="--c:#e78fa3" title="Giz rosa"></button>
      <button class="chalk" data-color="#89bcdc" style="--c:#89bcdc" title="Giz azul"></button>
      <button class="chalk" data-color="#8fceac" style="--c:#8fceac" title="Giz verde"></button>
      <button class="chalk" data-color="#e8a15c" style="--c:#e8a15c" title="Giz laranja"></button>
      <button class="chalk" data-color="#b48be0" style="--c:#b48be0" title="Giz roxo"></button>
      <button class="chalk" data-color="#e2685f" style="--c:#e2685f" title="Giz vermelho"></button>
      <button class="chalk" data-color="#7fd8d4" style="--c:#7fd8d4" title="Giz ciano"></button>
      <button class="chalk" data-color="#c7c7c7" style="--c:#c7c7c7" title="Giz cinza"></button>
      <div class="hex-wrap" title="Cor personalizada (hexadecimal)">
        <input type="color" id="chalkColorPicker" class="color-picker-native" value="#f6f3e6" tabindex="-1">
        <input type="text" id="chalkHexInput" class="hex-input" placeholder="#RRGGBB" maxlength="7" spellcheck="false">
      </div>
    </div>

    <div class="divider"></div>

    <div class="group">
      <button class="tool-btn active" id="penBtn" title="Giz (desenhar)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      </button>
      <button class="tool-btn" id="eraserBtn" title="Apagador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8.5L3 14.5a1 1 0 0 1 0-1.4l9-9a1 1 0 0 1 1.4 0l6.1 6.1a1 1 0 0 1 0 1.4L13 18"/><path d="M8 13l5 5"/></svg>
      </button>
      <button class="tool-btn" id="textBtn" title="Caixa de texto (clique para inserir, ou arraste na lousa para escolher o tamanho)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><text x="12" y="17" font-size="15" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" stroke="none" fill="currentColor">T</text></svg>
      </button>
    </div>

    <div class="divider"></div>

    <div class="group" id="bgGroup" title="Plano de fundo">
      <button class="bg-swatch bg-green active" data-bg="green" title="Quadro verde"></button>
      <button class="bg-swatch bg-black" data-bg="black" title="Quadro preto"></button>
      <button class="bg-swatch bg-white" data-bg="white" title="Lousa branca"></button>
      <button class="bg-swatch bg-grid" data-bg="grid" title="Quadriculada"></button>
      <button class="bg-swatch bg-lined" data-bg="lined" title="Pautada (linhas)"></button>
      <button class="bg-swatch bg-dots" data-bg="dots" title="Pontilhada"></button>
      <label class="bg-swatch bg-custom" id="bgUploadLabel" title="Carregar imagem de fundo do computador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>
        <input type="file" id="bgUploadInput" accept="image/*">
      </label>
    </div>

    <div class="divider" id="bgAdjustDivider" style="display:none;"></div>

    <div class="group bg-adjust-group" id="bgAdjustPanel" style="display:none;" title="Ajustar imagem de fundo">
      <span class="bg-adjust-icon" title="Zoom">🔍</span>
      <input type="range" id="bgZoomRange" min="40" max="300" value="100" title="Zoom da imagem (diminua para caber tudo)">
      <span class="bg-adjust-icon" title="Posição horizontal">↔</span>
      <input type="range" id="bgPosXRange" min="0" max="100" value="50" title="Posição horizontal">
      <span class="bg-adjust-icon" title="Posição vertical">↕</span>
      <input type="range" id="bgPosYRange" min="0" max="100" value="50" title="Posição vertical">
      <button class="ttbtn" id="bgResetAdjust" title="Redefinir imagem">↺</button>
    </div>

    <div class="divider"></div>

    <div class="size-wrap">
      <div class="size-dot"><span id="sizePreview"></span></div>
      <input type="range" id="sizeRange" min="2" max="34" value="6">
    </div>

    <div class="divider"></div>

    <div class="group">
      <button class="tool-btn" id="undoBtn" title="Desfazer (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A5.5 5.5 0 0 1 20 14.5v0A5.5 5.5 0 0 1 14.5 20H11"/></svg>
      </button>
      <button class="tool-btn" id="redoBtn" title="Refazer (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <div class="group">
      <button class="tool-btn" id="clearBtn" title="Limpar lousa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
      </button>
      <button class="tool-btn" id="saveBtn" title="Salvar como imagem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardBg = document.getElementById('boardBg');
  const bgCtx = boardBg.getContext('2d');
  const wrap = canvas.parentElement;
  const textLayer = document.getElementById('textLayer');
  const textToolbar = document.getElementById('textToolbar');

  let color = '#f6f3e6';
  let size = 6;
  let tool = 'pen'; // 'pen' | 'eraser'
  let drawing = false;
  let last = null;

  let undoStack = [];
  let redoStack = [];
  const MAX_HISTORY = 40;

  let bgMode = 'green';

  const CSS_BG = {
    green: 'radial-gradient(140% 100% at 15% 0%, #20463a 0%, #173229 55%, #122720 100%)',
    black: 'radial-gradient(140% 100% at 15% 0%, #2b2b2b 0%, #1c1c1c 55%, #111111 100%)',
    white: '#f7f7f2',
    grid: '#f7f7f2',
    lined: '#f7f7f2',
    dots: '#f7f7f2'
  };

  function drawGreenboard(w,h){
    const g = bgCtx.createRadialGradient(w*0.15,0,w*0.05, w*0.15,0,w*1.1);
    g.addColorStop(0,'#20463a'); g.addColorStop(0.55,'#173229'); g.addColorStop(1,'#122720');
    bgCtx.fillStyle = g; bgCtx.fillRect(0,0,w,h);
  }
  function drawBlackboard(w,h){
    const g = bgCtx.createRadialGradient(w*0.15,0,w*0.05, w*0.15,0,w*1.1);
    g.addColorStop(0,'#2b2b2b'); g.addColorStop(0.55,'#1c1c1c'); g.addColorStop(1,'#111111');
    bgCtx.fillStyle = g; bgCtx.fillRect(0,0,w,h);
  }
  function drawWhiteboard(w,h){
    bgCtx.fillStyle = '#f7f7f2';
    bgCtx.fillRect(0,0,w,h);
    const g = bgCtx.createRadialGradient(w*0.5,h*0.5,Math.min(w,h)*0.2, w*0.5,h*0.5, Math.max(w,h)*0.75);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.05)');
    bgCtx.fillStyle = g; bgCtx.fillRect(0,0,w,h);
  }
  function drawGrid(w,h,dpr){
    drawWhiteboard(w,h);
    const step = 28*dpr;
    bgCtx.strokeStyle = 'rgba(70,110,150,0.22)';
    bgCtx.lineWidth = Math.max(1, dpr);
    bgCtx.beginPath();
    for(let x=step; x<w; x+=step){ bgCtx.moveTo(x,0); bgCtx.lineTo(x,h); }
    for(let y=step; y<h; y+=step){ bgCtx.moveTo(0,y); bgCtx.lineTo(w,y); }
    bgCtx.stroke();
  }
  function drawLined(w,h,dpr){
    drawWhiteboard(w,h);
    const step = 38*dpr;
    bgCtx.strokeStyle = 'rgba(70,110,180,0.28)';
    bgCtx.lineWidth = Math.max(1, dpr);
    bgCtx.beginPath();
    for(let y=step; y<h; y+=step){ bgCtx.moveTo(0,y); bgCtx.lineTo(w,y); }
    bgCtx.stroke();
    bgCtx.strokeStyle = 'rgba(220,90,90,0.35)';
    bgCtx.beginPath();
    const mx = 46*dpr;
    bgCtx.moveTo(mx,0); bgCtx.lineTo(mx,h);
    bgCtx.stroke();
  }
  function drawDots(w,h,dpr){
    drawWhiteboard(w,h);
    const step = 26*dpr;
    bgCtx.fillStyle = 'rgba(70,90,120,0.32)';
    const r = Math.max(1, 1.4*dpr);
    for(let x=step; x<w; x+=step){
      for(let y=step; y<h; y+=step){
        bgCtx.beginPath(); bgCtx.arc(x,y,r,0,Math.PI*2); bgCtx.fill();
      }
    }
  }

  let customBgImage = null;
  let customBgTransform = { zoom: 1, offsetX: 0.5, offsetY: 0.5 };
  function drawCustomImage(w,h){
    // "moldura" atrás da imagem: aparece quando o zoom deixa a imagem menor que a lousa
    bgCtx.fillStyle = '#2a1c11';
    bgCtx.fillRect(0, 0, w, h);
    if(!customBgImage) return;
    const img = customBgImage;
    const baseScale = Math.max(w / img.width, h / img.height);
    const scale = baseScale * (customBgTransform.zoom || 1);
    const dw = img.width * scale;
    const dh = img.height * scale;
    // offsetX/offsetY tanto posicionam a imagem (quando menor que a lousa)
    // quanto fazem o "pan" pelo recorte (quando maior que a lousa)
    const dx = (w - dw) * customBgTransform.offsetX;
    const dy = (h - dh) * customBgTransform.offsetY;
    bgCtx.drawImage(img, 0, 0, img.width, img.height, dx, dy, dw, dh);
  }

  const BG_PRESETS = {
    green: (w,h,dpr) => drawGreenboard(w,h),
    black: (w,h,dpr) => drawBlackboard(w,h),
    white: (w,h,dpr) => drawWhiteboard(w,h),
    grid:  (w,h,dpr) => drawGrid(w,h,dpr),
    lined: (w,h,dpr) => drawLined(w,h,dpr),
    dots:  (w,h,dpr) => drawDots(w,h,dpr),
    custom: (w,h,dpr) => drawCustomImage(w,h)
  };

  // O quadro agora tem DUAS camadas:
  // - boardBg: pinta a cor/padrão da lousa (verde, preta, quadriculada...) e nunca é tocada pela borracha.
  // - board (canvas principal): só contém os traços de giz, sobre fundo transparente.
  // Assim, a borracha (destination-out) revela sempre a cor/padrão correta da lousa por baixo,
  // em vez de apagar para transparente e depender de um CSS de fallback.
  function paintBackground(){
    bgCtx.save();
    bgCtx.setTransform(1,0,0,1,0,0);
    BG_PRESETS[bgMode](boardBg.width, boardBg.height, window.devicePixelRatio || 1);
    bgCtx.restore();
  }

  function clearStrokes(){
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  function setupCanvas(preserve){
    const dpr = window.devicePixelRatio || 1;
    const rect = wrap.getBoundingClientRect();
    const prevStrokes = preserve ? canvas.toDataURL() : null;

    const w = Math.round((rect.width - 28) * dpr);
    const h = Math.round((rect.height - 28) * dpr);

    canvas.width = w;
    canvas.height = h;
    canvas.style.width = (rect.width - 28) + 'px';
    canvas.style.height = (rect.height - 28) + 'px';

    boardBg.width = w;
    boardBg.height = h;

    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    bgCtx.setTransform(1,0,0,1,0,0);
    bgCtx.scale(dpr, dpr);

    paintBackground();

    if(prevStrokes){
      const img = new Image();
      img.onload = function(){
        ctx.save();
        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      };
      img.src = prevStrokes;
    } else {
      clearStrokes();
    }

    syncOverlayLayers();
  }

  function syncOverlayLayers(){
    const wrapRect = wrap.getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();
    const left = (canvasRect.left - wrapRect.left) + 'px';
    const top = (canvasRect.top - wrapRect.top) + 'px';

    boardBg.style.left = left;
    boardBg.style.top = top;
    boardBg.style.width = canvasRect.width + 'px';
    boardBg.style.height = canvasRect.height + 'px';

    textLayer.style.left = left;
    textLayer.style.top = top;
    textLayer.style.width = canvasRect.width + 'px';
    textLayer.style.height = canvasRect.height + 'px';
    if(currentBox) updateToolbarPosition(currentBox);
  }

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const t = e.touches ? e.touches[0] : e;
    return {
      x: (t.clientX - rect.left),
      y: (t.clientY - rect.top)
    };
  }

  function pushHistory(){
    try{
      undoStack.push(canvas.toDataURL());
      if(undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack = [];
      updateHistoryButtons();
    }catch(e){}
  }

  function restoreFrom(dataUrl){
    const img = new Image();
    img.onload = function(){
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    };
    img.src = dataUrl;
  }

  function updateHistoryButtons(){
    document.getElementById('undoBtn').disabled = undoStack.length === 0;
    document.getElementById('redoBtn').disabled = redoStack.length === 0;
  }

  let textDragStart = null;
  let textDragCurrent = null;
  let textDragPreview = null;

  function positionDragPreview(p1, p2){
    const x = Math.min(p1.x, p2.x);
    const y = Math.min(p1.y, p2.y);
    const w = Math.abs(p2.x - p1.x);
    const h = Math.abs(p2.y - p1.y);
    textDragPreview.style.left = x + 'px';
    textDragPreview.style.top = y + 'px';
    textDragPreview.style.width = w + 'px';
    textDragPreview.style.height = h + 'px';
  }

  function startDraw(e){
    if(tool === 'text'){
      e.preventDefault();
      textDragStart = pos(e);
      textDragCurrent = textDragStart;
      textDragPreview = document.createElement('div');
      textDragPreview.className = 'text-drag-preview';
      textLayer.appendChild(textDragPreview);
      positionDragPreview(textDragStart, textDragStart);
      return;
    }
    e.preventDefault();
    drawing = true;
    last = pos(e);
  }

  function moveDraw(e){
    if(tool === 'text' && textDragStart){
      e.preventDefault();
      textDragCurrent = pos(e);
      positionDragPreview(textDragStart, textDragCurrent);
      return;
    }
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    if(tool === 'eraser'){
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = size * 3;
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.shadowColor = color;
      ctx.shadowBlur = size * 0.35;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    last = p;
  }

  function endDraw(){
    if(tool === 'text' && textDragStart){
      const p1 = textDragStart;
      const p2 = textDragCurrent || textDragStart;
      const w = Math.abs(p2.x - p1.x);
      const h = Math.abs(p2.y - p1.y);
      const origin = { x: Math.min(p1.x, p2.x), y: Math.min(p1.y, p2.y) };
      if(textDragPreview){ textDragPreview.remove(); textDragPreview = null; }
      if(w > 18 && h > 18){
        createTextBox(origin, { width: w });
      } else {
        createTextBox(p1);
      }
      textDragStart = null;
      textDragCurrent = null;
      return;
    }
    if(!drawing) return;
    drawing = false;
    last = null;
    pushHistory();
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  window.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', startDraw, {passive:false});
  canvas.addEventListener('touchmove', moveDraw, {passive:false});
  canvas.addEventListener('touchend', endDraw);

  window.addEventListener('resize', function(){ setupCanvas(true); });

  // Tools
  const penBtn = document.getElementById('penBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const textBtn = document.getElementById('textBtn');
  const boardWrapEl = document.querySelector('.board-wrap');

  function setTool(t){
    tool = t;
    penBtn.classList.toggle('active', t === 'pen');
    eraserBtn.classList.toggle('active', t === 'eraser');

  }

  // Upload de imagem de fundo do computador
  const bgUploadInput = document.getElementById('bgUploadInput');

  // ---------- Text boxes ----------
  let textBoxes = [];
  let currentBox = null;
  let boxCounter = 0;
  let topZIndex = 10;

  function bringToFront(box){
    topZIndex += 1;
    box.style.zIndex = topZIndex;
  }

  function createTextBox(p, sizeOpt){
    const rect = textLayer.getBoundingClientRect();
    const leftPct = Math.max(0, Math.min(96, (p.x / rect.width) * 100));
    const topPct = Math.max(0, Math.min(96, (p.y / rect.height) * 100));

    const box = document.createElement('div');
    box.className = 'text-box';
    box.style.left = leftPct + '%';
    box.style.top = topPct + '%';
    box.dataset.id = 'tb' + (++boxCounter);
    if(sizeOpt && sizeOpt.width){
      box.style.width = Math.max(60, Math.min(sizeOpt.width, rect.width - p.x)) + 'px';
    }

    const bar = document.createElement('div');
    bar.className = 'text-box-bar';
    bar.innerHTML = '<span class="grip">::::</span><button class="del" title="Excluir">✕</button>';

    const content = document.createElement('div');
    content.className = 'text-box-content';
    content.contentEditable = 'true';
    content.style.fontFamily = "'Caveat', cursive";
    content.style.fontSize = '28px';
    content.style.color = color;
    content.style.fontWeight = 'normal';
    content.style.fontStyle = 'normal';
    content.style.textDecorationLine = 'none';
    content.style.textAlign = 'left';
    content.style.backgroundColor = 'transparent';

    const handles = {};
    ['n','s','e','w','ne','nw','se','sw'].forEach(function(dir){
      const h = document.createElement('div');
      h.className = 'resize-handle rh-' + dir;
      h.title = 'Arraste para redimensionar';
      h.addEventListener('mousedown', function(e){ startResizeBox(box, e, dir); });
      h.addEventListener('touchstart', function(e){ startResizeBox(box, e, dir); }, {passive:false});
      handles[dir] = h;
    });

    box.appendChild(bar);
    box.appendChild(content);
    Object.keys(handles).forEach(dir => box.appendChild(handles[dir]));
    textLayer.appendChild(box);
    textBoxes.push(box);

    box.addEventListener('mousedown', function(e){ e.stopPropagation(); selectBox(box); });
    box.addEventListener('touchstart', function(e){ e.stopPropagation(); selectBox(box); }, {passive:true});

    bar.addEventListener('mousedown', function(e){ startDragBox(box, e); });
    bar.addEventListener('touchstart', function(e){ startDragBox(box, e); }, {passive:false});

    bar.querySelector('.del').addEventListener('click', function(e){
      e.stopPropagation();
      removeTextBox(box);
    });

    content.addEventListener('blur', function(){
      if(content.innerText.trim() === ''){
        removeTextBox(box);
      }
    });

    // Move o menu de formatação conforme a caixa cresce/encolhe (ex.: enquanto o usuário escreve)
    content.addEventListener('input', function(){
      if(currentBox === box) updateToolbarPosition(box);
    });
    if(typeof ResizeObserver !== 'undefined'){
      const ro = new ResizeObserver(function(){
        if(currentBox === box) updateToolbarPosition(box);
      });
      ro.observe(box);
      box._resizeObserver = ro;
    }

    selectBox(box);
    content.focus();
  }

  function startResizeBox(box, e, dir){
    e.preventDefault();
    e.stopPropagation();
    if(box.classList.contains('image-box')){
      selectImageBox(box);
    } else {
      selectBox(box);
    }
    const MIN = 40;
    const layerRect = textLayer.getBoundingClientRect();
    const boxRect = box.getBoundingClientRect();
    const start = e.touches ? e.touches[0] : e;
    const startX = start.clientX;
    const startY = start.clientY;
    const startLeft = boxRect.left - layerRect.left;
    const startTop = boxRect.top - layerRect.top;
    const startWidth = boxRect.width;
    const startHeight = boxRect.height;

    function onMove(ev){
      ev.preventDefault();
      const t = ev.touches ? ev.touches[0] : ev;
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;

      let left = startLeft, top = startTop, width = startWidth, height = startHeight;

      if(dir.includes('e')){
        width = Math.max(MIN, Math.min(startWidth + dx, layerRect.width - startLeft));
      }
      if(dir.includes('s')){
        height = Math.max(MIN, Math.min(startHeight + dy, layerRect.height - startTop));
      }
      if(dir.includes('w')){
        width = Math.max(MIN, startWidth - dx);
        left = Math.min(startLeft + startWidth - MIN, Math.max(0, startLeft + dx));
        width = startLeft + startWidth - left;
      }
      if(dir.includes('n')){
        height = Math.max(MIN, startHeight - dy);
        top = Math.min(startTop + startHeight - MIN, Math.max(0, startTop + dy));
        height = startTop + startHeight - top;
      }

      box.style.width = width + 'px';
      box.style.height = height + 'px';
      box.style.left = (left / layerRect.width * 100) + '%';
      box.style.top = (top / layerRect.height * 100) + '%';
      updateToolbarPosition(box);
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('touchend', onUp);
  }

  function removeTextBox(box){
    if(currentBox === box) deselectBox();
    if(box._resizeObserver){ box._resizeObserver.disconnect(); }
    textBoxes = textBoxes.filter(b => b !== box);
    box.remove();
  }

  // ---------- Image boxes (imagens coladas ou soltas na lousa) ----------
  let imageBoxes = [];
  let currentImageBox = null;
  let imgBoxCounter = 0;

  function createImageBox(origin, src, naturalW, naturalH){
    const rect = textLayer.getBoundingClientRect();

    // Redimensiona a imagem para caber confortavelmente na lousa, mantendo a proporção
    const maxW = Math.max(80, rect.width * 0.6);
    const maxH = Math.max(80, rect.height * 0.6);
    let w = naturalW || 200, h = naturalH || 200;
    if(w > maxW){ h = h * (maxW / w); w = maxW; }
    if(h > maxH){ w = w * (maxH / h); h = maxH; }
    w = Math.max(60, w);
    h = Math.max(60, h);

    let x = origin ? origin.x - w / 2 : (rect.width - w) / 2;
    let y = origin ? origin.y - h / 2 : (rect.height - h) / 2;
    x = Math.max(0, Math.min(x, Math.max(0, rect.width - w)));
    y = Math.max(0, Math.min(y, Math.max(0, rect.height - h)));

    const box = document.createElement('div');
    box.className = 'image-box';
    box.style.left = (x / rect.width * 100) + '%';
    box.style.top = (y / rect.height * 100) + '%';
    box.style.width = w + 'px';
    box.style.height = h + 'px';
    box.dataset.id = 'ib' + (++imgBoxCounter);

    const bar = document.createElement('div');
    bar.className = 'image-box-bar';
    bar.innerHTML = '<span class="grip">::::</span><button class="del" title="Excluir">✕</button>';

    const img = document.createElement('img');
    img.className = 'image-box-content';
    img.draggable = false;
    img.alt = 'Imagem colada na lousa';
    img.src = src;

    const handles = {};
    ['n','s','e','w','ne','nw','se','sw'].forEach(function(dir){
      const h2 = document.createElement('div');
      h2.className = 'resize-handle rh-' + dir;
      h2.title = 'Arraste para redimensionar';
      h2.addEventListener('mousedown', function(e){ startResizeBox(box, e, dir); });
      h2.addEventListener('touchstart', function(e){ startResizeBox(box, e, dir); }, {passive:false});
      handles[dir] = h2;
    });

    box.appendChild(bar);
    box.appendChild(img);
    Object.keys(handles).forEach(dir => box.appendChild(handles[dir]));
    textLayer.appendChild(box);
    imageBoxes.push(box);

    box.addEventListener('mousedown', function(e){
      if(e.target.closest('.del')) return;
      e.stopPropagation();
      selectImageBox(box);
      if(!e.target.closest('.resize-handle')){
        startDragBox(box, e);
      }
    });
    box.addEventListener('touchstart', function(e){
      if(e.target.closest('.del')) return;
      e.stopPropagation();
      selectImageBox(box);
      if(!e.target.closest('.resize-handle')){
        startDragBox(box, e);
      }
    }, {passive:false});

    bar.addEventListener('mousedown', function(e){ startDragBox(box, e); });
    bar.addEventListener('touchstart', function(e){ startDragBox(box, e); }, {passive:false});

    bar.querySelector('.del').addEventListener('click', function(e){
      e.stopPropagation();
      removeImageBox(box);
    });

    selectImageBox(box);
    return box;
  }

  function removeImageBox(box){
    if(currentImageBox === box) deselectImageBox();
    imageBoxes = imageBoxes.filter(b => b !== box);
    box.remove();
  }

  function selectImageBox(box){
    deselectBox();
    bringToFront(box);
    if(currentImageBox && currentImageBox !== box) currentImageBox.classList.remove('selected');
    currentImageBox = box;
    box.classList.add('selected');
  }

  function deselectImageBox(){
    if(currentImageBox) currentImageBox.classList.remove('selected');
    currentImageBox = null;
  }

  // Cola (Ctrl+V) uma imagem da área de transferência como uma caixa independente e
  // arrastável na lousa — inclusive quando o cursor está dentro de uma caixa de texto,
  // evitando que ela seja apagada por ficar "vazia" ao perder o foco.
  document.addEventListener('paste', function(e){
    const items = (e.clipboardData && e.clipboardData.items) || [];
    let imageFile = null;
    for(let i = 0; i < items.length; i++){
      if(items[i].type && items[i].type.indexOf('image') === 0){
        imageFile = items[i].getAsFile();
        break;
      }
    }
    if(!imageFile) return; // não é imagem: deixa o comportamento padrão (colar texto, etc.)

    e.preventDefault();
    e.stopPropagation();

    const targetTextBox = e.target.closest ? e.target.closest('.text-box') : null;

    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        let origin = null;
        if(targetTextBox){
          const layerRect = textLayer.getBoundingClientRect();
          const boxRect = targetTextBox.getBoundingClientRect();
          origin = {
            x: (boxRect.left - layerRect.left) + boxRect.width / 2,
            y: (boxRect.top - layerRect.top) + boxRect.height / 2
          };
        }
        createImageBox(origin, ev.target.result, img.width, img.height);
      };
      img.onerror = function(){ alert('Não foi possível colar essa imagem.'); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ alert('Não foi possível ler a imagem colada.'); };
    reader.readAsDataURL(imageFile);
  });

  function selectBox(box){
    deselectImageBox();
    bringToFront(box);
    if(currentBox && currentBox !== box) currentBox.classList.remove('selected');
    currentBox = box;
    box.classList.add('selected');
    syncToolbarFromBox(box);
    updateToolbarPosition(box);
    textToolbar.classList.add('visible');
  }

  function deselectBox(){
    if(currentBox) currentBox.classList.remove('selected');
    currentBox = null;
    textToolbar.classList.remove('visible');
  }

  function updateToolbarPosition(box){
    const wrapRect = wrap.getBoundingClientRect();
    const boxRect = box.getBoundingClientRect();
    const tbWidth = textToolbar.offsetWidth || 260;
    const tbHeight = textToolbar.offsetHeight || 36;

    // Preferência 1: colocar o menu à direita da caixa, para não cobrir o que está sendo escrito.
    let left = (boxRect.right - wrapRect.left) + 10;
    let top = (boxRect.top - wrapRect.top);

    // Preferência 2: se não couber à direita, tenta à esquerda da caixa.
    if(left + tbWidth > wrapRect.width - 4){
      const leftSide = (boxRect.left - wrapRect.left) - tbWidth - 10;
      if(leftSide >= 4){
        left = leftSide;
      } else {
        // Preferência 3: sem espaço nas laterais, cai para acima/abaixo da caixa (sem sobrepor o texto).
        left = Math.max(4, Math.min((boxRect.left - wrapRect.left), wrapRect.width - tbWidth - 4));
        top = (boxRect.top - wrapRect.top) - tbHeight - 6;
        if(top < 4) top = (boxRect.bottom - wrapRect.top) + 6;
      }
    }

    top = Math.max(4, Math.min(top, wrapRect.height - tbHeight - 4));
    textToolbar.style.top = top + 'px';
    textToolbar.style.left = left + 'px';
  }

  function startDragBox(box, e){
    e.preventDefault();
    e.stopPropagation();
    if(box.classList.contains('image-box')){
      selectImageBox(box);
    } else {
      selectBox(box);
    }
    const rect = textLayer.getBoundingClientRect();
    const boxRect = box.getBoundingClientRect();
    const start = e.touches ? e.touches[0] : e;
    const offsetX = start.clientX - boxRect.left;
    const offsetY = start.clientY - boxRect.top;

    function onMove(ev){
      const t = ev.touches ? ev.touches[0] : ev;
      let x = t.clientX - rect.left - offsetX;
      let y = t.clientY - rect.top - offsetY;
      x = Math.max(0, Math.min(x, rect.width - boxRect.width));
      y = Math.max(0, Math.min(y, rect.height - boxRect.height));
      box.style.left = (x / rect.width * 100) + '%';
      box.style.top = (y / rect.height * 100) + '%';
      updateToolbarPosition(box);
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('touchend', onUp);
  }

  // Text toolbar controls
  const ttFont = document.getElementById('ttFont');
  const ttSize = document.getElementById('ttSize');
  const ttBold = document.getElementById('ttBold');
  const ttItalic = document.getElementById('ttItalic');
  const ttUnderline = document.getElementById('ttUnderline');
  const ttStrike = document.getElementById('ttStrike');
  const ttAlign = document.getElementById('ttAlign');
  const ttDelete = document.getElementById('ttDelete');

  function syncAlignLabel(){
    ttAlign.textContent = ALIGN_ICONS.left;
  }

  const ALIGN_STATES = ['left', 'center', 'right'];
  const ALIGN_ICONS = { left: '⟸', center: '≡', right: '⟹' };

  function syncToolbarFromBox(box){
    const content = box.querySelector('.text-box-content');
    ttFont.value = content.style.fontFamily || "'Caveat', cursive";
    ttSize.value = parseInt(content.style.fontSize, 10) || 28;
    ttBold.classList.toggle('on', content.style.fontWeight === 'bold');
    ttItalic.classList.toggle('on', content.style.fontStyle === 'italic');

    const decoration = content.style.textDecorationLine || content.style.textDecoration || '';
    ttUnderline.classList.toggle('on', decoration.includes('underline'));
    ttStrike.classList.toggle('on', decoration.includes('line-through'));

    const align = content.style.textAlign || 'left';
    ttAlign.textContent = ALIGN_ICONS[align] || ALIGN_ICONS.left;

    textToolbar.querySelectorAll('.tt-color').forEach(c => {
      c.classList.toggle('on', c.dataset.color.toLowerCase() === (content.style.color || '').toLowerCase()
        || rgbToHex(content.style.color) === c.dataset.color.toLowerCase());
    });
    const currentColor = content.style.color || '#f6f3e6';
    ttColorHex.value = currentColor;
    if(isValidHex(currentColor)) ttColorPicker.value = normalizeHex(currentColor);

    const bg = content.style.backgroundColor || '';
    textToolbar.querySelectorAll('.tt-bg').forEach(c => {
      const isNone = c.dataset.bg === '';
      c.classList.toggle('on', isNone ? (bg === '' || bg === 'transparent') : bg === c.dataset.bg);
    });
  }

  function toggleDecoration(content, value){
    const current = (content.style.textDecorationLine || content.style.textDecoration || '')
      .split(' ').filter(Boolean).filter(v => v !== 'none');
    const has = current.includes(value);
    const next = has ? current.filter(v => v !== value) : current.concat(value);
    content.style.textDecorationLine = next.length ? next.join(' ') : 'none';
  }

  function rgbToHex(rgb){
    const m = (rgb || '').match(/\d+/g);
    if(!m) return '';
    return '#' + m.slice(0,3).map(n => parseInt(n,10).toString(16).padStart(2,'0')).join('');
  }

  ttFont.addEventListener('change', function(){
    if(!currentBox) return;
    currentBox.querySelector('.text-box-content').style.fontFamily = ttFont.value;
  });
  ttSize.addEventListener('input', function(){
    if(!currentBox) return;
    currentBox.querySelector('.text-box-content').style.fontSize = ttSize.value + 'px';
    updateToolbarPosition(currentBox);
  });
  ttBold.addEventListener('click', function(){
    if(!currentBox) return;
    const content = currentBox.querySelector('.text-box-content');
    const isBold = content.style.fontWeight === 'bold';
    content.style.fontWeight = isBold ? 'normal' : 'bold';
    ttBold.classList.toggle('on', !isBold);
  });
  ttItalic.addEventListener('click', function(){
    if(!currentBox) return;
    const content = currentBox.querySelector('.text-box-content');
    const isItalic = content.style.fontStyle === 'italic';
    content.style.fontStyle = isItalic ? 'normal' : 'italic';
    ttItalic.classList.toggle('on', !isItalic);
  });
  ttUnderline.addEventListener('click', function(){
    if(!currentBox) return;
    const content = currentBox.querySelector('.text-box-content');
    toggleDecoration(content, 'underline');
    syncToolbarFromBox(currentBox);
  });
  ttStrike.addEventListener('click', function(){
    if(!currentBox) return;
    const content = currentBox.querySelector('.text-box-content');
    toggleDecoration(content, 'line-through');
    syncToolbarFromBox(currentBox);
  });
  ttAlign.addEventListener('click', function(){
    if(!currentBox) return;
    const content = currentBox.querySelector('.text-box-content');
    const current = content.style.textAlign || 'left';
    const next = ALIGN_STATES[(ALIGN_STATES.indexOf(current) + 1) % ALIGN_STATES.length];
    content.style.textAlign = next;
    ttAlign.textContent = ALIGN_ICONS[next];
  });
  textToolbar.querySelectorAll('.tt-color').forEach(function(swatch){
    swatch.addEventListener('click', function(){
      if(!currentBox) return;
      currentBox.querySelector('.text-box-content').style.color = swatch.dataset.color;
      textToolbar.querySelectorAll('.tt-color').forEach(c => c.classList.remove('on'));
      swatch.classList.add('on');
      ttColorHex.value = swatch.dataset.color;
      ttColorPicker.value = normalizeHex(swatch.dataset.color);
    });
  });

  const ttColorPicker = document.getElementById('ttColorPicker');
  const ttColorHex = document.getElementById('ttColorHex');

  function applyTtColor(hex){
    if(!currentBox) return;
    currentBox.querySelector('.text-box-content').style.color = hex;
    textToolbar.querySelectorAll('.tt-color').forEach(c => c.classList.remove('on'));
    ttColorPicker.value = normalizeHex(hex);
    ttColorHex.value = hex;
  }
  ttColorPicker.addEventListener('input', function(){
    applyTtColor(ttColorPicker.value);
  });
  function commitTtHex(){
    if(!currentBox) return;
    let v = ttColorHex.value.trim();
    if(v && v[0] !== '#') v = '#' + v;
    if(isValidHex(v)){
      applyTtColor(normalizeHex(v));
    } else {
      const content = currentBox.querySelector('.text-box-content');
      ttColorHex.value = content.style.color || '#f6f3e6';
    }
  }
  ttColorHex.addEventListener('change', commitTtHex);
  ttColorHex.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); commitTtHex(); ttColorHex.blur(); }
  });
  textToolbar.querySelectorAll('.tt-bg').forEach(function(swatch){
    swatch.addEventListener('click', function(){
      if(!currentBox) return;
      const content = currentBox.querySelector('.text-box-content');
      const bg = swatch.dataset.bg;
      content.style.backgroundColor = bg || 'transparent';
      content.style.borderRadius = bg ? '4px' : '0';
      content.style.padding = bg ? '2px 5px' : '0';
      textToolbar.querySelectorAll('.tt-bg').forEach(c => c.classList.remove('on'));
      swatch.classList.add('on');
    });
  });
  ttDelete.addEventListener('click', function(){
    if(!currentBox) return;
    removeTextBox(currentBox);
  });

  document.addEventListener('mousedown', function(e){
    if(!e.target.closest('.image-box')) deselectImageBox();
    if(e.target.closest('.text-box') || e.target.closest('.text-toolbar') || e.target.closest('#textBtn')) return;
    deselectBox();
  });

  // Helpers de cor hexadecimal
  function isValidHex(v){ return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v); }
  function normalizeHex(v){
    let h = v.replace('#', '');
    if(h.length === 3) h = h.split('').map(c => c + c).join('');
    return '#' + h.toLowerCase();
  }

  // Colors
  const chalkGroup = document.getElementById('chalkGroup');
  const chalkColorPicker = document.getElementById('chalkColorPicker');
  const chalkHexInput = document.getElementById('chalkHexInput');

  function applyChalkColor(hex){
    color = hex;
    chalkGroup.querySelectorAll('.chalk').forEach(c => c.classList.remove('active'));
    chalkColorPicker.value = normalizeHex(hex);
    chalkHexInput.value = hex;
    setTool('pen');
    updateSizePreview();
  }

  chalkGroup.addEventListener('click', function(e){
    const btn = e.target.closest('.chalk');
    if(!btn) return;
    color = btn.dataset.color;
    chalkGroup.querySelectorAll('.chalk').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    chalkColorPicker.value = normalizeHex(color);
    chalkHexInput.value = color;
    setTool('pen');
    updateSizePreview();
  });

  chalkColorPicker.addEventListener('input', function(){
    applyChalkColor(chalkColorPicker.value);
  });

  function commitChalkHex(){
    let v = chalkHexInput.value.trim();
    if(v && v[0] !== '#') v = '#' + v;
    if(isValidHex(v)){
      applyChalkColor(normalizeHex(v));
    } else {
      chalkHexInput.value = color;
    }
  }
  chalkHexInput.addEventListener('change', commitChalkHex);
  chalkHexInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); commitChalkHex(); chalkHexInput.blur(); }
  });

  // Size
  const sizeRange = document.getElementById('sizeRange');
  const sizePreview = document.getElementById('sizePreview');
  function updateSizePreview(){
    const s = Math.max(4, Math.min(16, size));
    sizePreview.style.width = s + 'px';
    sizePreview.style.height = s + 'px';
    const eraserPreview = {green:'#20463a', black:'#1c1c1c', white:'#f7f7f2', grid:'#f7f7f2', lined:'#f7f7f2', dots:'#f7f7f2', custom:'#b9b3a2'};
    sizePreview.style.background = tool === 'eraser' ? eraserPreview[bgMode] : color;
  }
  sizeRange.addEventListener('input', function(){
    size = parseInt(this.value, 10);
    updateSizePreview();
  });

  // Undo / redo
  document.getElementById('undoBtn').addEventListener('click', function(){
    if(undoStack.length === 0) return;
    const cur = canvas.toDataURL();
    redoStack.push(cur);
    const prev = undoStack.pop();
    if(undoStack.length === 0){
      clearStrokes();
    } else {
      restoreFrom(undoStack[undoStack.length - 1]);
    }
    updateHistoryButtons();
  });

  document.getElementById('redoBtn').addEventListener('click', function(){
    if(redoStack.length === 0) return;
    const next = redoStack.pop();
    undoStack.push(next);
    restoreFrom(next);
    updateHistoryButtons();
  });

  document.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
      e.preventDefault();
      document.getElementById('undoBtn').click();
    }
    if((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase()==='z'))){
      e.preventDefault();
      document.getElementById('redoBtn').click();
    }
    if((e.key === 'Delete' || e.key === 'Backspace') && currentImageBox){
      const active = document.activeElement;
      const isEditingText = active && (active.isContentEditable || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
      if(!isEditingText){
        e.preventDefault();
        removeImageBox(currentImageBox);
      }
    }
  });

  // Clear
  document.getElementById('clearBtn').addEventListener('click', function(){
    pushHistory();
    clearStrokes();
    textBoxes.slice().forEach(removeTextBox);
    imageBoxes.slice().forEach(removeImageBox);
  });

  // Save (bakes text boxes into the exported image)
  document.getElementById('saveBtn').addEventListener('click', function(){
    const dpr = window.devicePixelRatio || 1;

    // Espaço reservado no topo da imagem para o título da lousa
    const labelStyle = getComputedStyle(boardLabel);
    const titleText = (boardLabel.textContent || '').replace(/\s+/g, ' ').trim() || 'lousa';
    const titleFontSizeCss = parseFloat(labelStyle.fontSize) || 30;
    const titleBarHeightCss = Math.round(titleFontSizeCss * 1.5 + 30);
    const titleBarHeightPx = Math.round(titleBarHeightCss * dpr);

    const temp = document.createElement('canvas');
    temp.width = canvas.width;
    temp.height = canvas.height + titleBarHeightPx;
    const tctx = temp.getContext('2d');

    tctx.drawImage(boardBg, 0, titleBarHeightPx);
    tctx.drawImage(canvas, 0, titleBarHeightPx);
    tctx.scale(dpr, dpr);

    const cssWidth = temp.width / dpr;

    // Barra com o título da lousa
    tctx.fillStyle = '#3a2617';
    tctx.fillRect(0, 0, cssWidth, titleBarHeightCss);

    const titleItalic = labelStyle.fontStyle === 'italic' ? 'italic ' : '';
    const titleWeight = parseInt(labelStyle.fontWeight, 10) >= 600 ? 'bold ' : '';
    tctx.fillStyle = labelStyle.color;
    tctx.font = titleItalic + titleWeight + titleFontSizeCss + 'px ' + labelStyle.fontFamily;
    tctx.textBaseline = 'middle';
    const titleAlignSaved = boardLabel.style.textAlign || 'left';
    if(titleAlignSaved === 'center'){
      tctx.textAlign = 'center';
      tctx.fillText(titleText, cssWidth / 2, titleBarHeightCss / 2);
    } else if(titleAlignSaved === 'right'){
      tctx.textAlign = 'right';
      tctx.fillText(titleText, cssWidth - 20, titleBarHeightCss / 2);
    } else {
      tctx.textAlign = 'left';
      tctx.fillText(titleText, 20, titleBarHeightCss / 2);
    }
    tctx.textAlign = 'left';

    const canvasRect = canvas.getBoundingClientRect();
    imageBoxes.forEach(function(box){
      const img = box.querySelector('.image-box-content');
      if(!img || !img.complete || !img.naturalWidth) return;
      const rect = img.getBoundingClientRect();
      const x = rect.left - canvasRect.left;
      const y = (rect.top - canvasRect.top) + titleBarHeightCss;
      tctx.drawImage(img, x, y, rect.width, rect.height);
    });
    textBoxes.forEach(function(box){
      const content = box.querySelector('.text-box-content');
      const text = content.innerText;
      if(!text || !text.trim()) return;
      const rect = content.getBoundingClientRect();
      const x = rect.left - canvasRect.left;
      const y = (rect.top - canvasRect.top) + titleBarHeightCss;
      const style = getComputedStyle(content);
      const fontSize = parseFloat(style.fontSize);
      tctx.fillStyle = style.color;
      tctx.font = (style.fontStyle === 'italic' ? 'italic ' : '') +
                  (parseInt(style.fontWeight,10) >= 600 ? 'bold ' : '') +
                  fontSize + 'px ' + style.fontFamily;
      tctx.textBaseline = 'top';
      text.split('\n').forEach(function(line, i){
        tctx.fillText(line, x, y + i * fontSize * 1.25);
      });
    });

    const link = document.createElement('a');
    link.download = 'lousa-' + Date.now() + '.png';
    link.href = temp.toDataURL('image/png');
    link.click();
  });

  // Renomear a lousa
  const boardLabel = document.getElementById('boardLabel');
  try{
    const savedName = localStorage.getItem('lousa-nome');
    if(savedName) boardLabel.textContent = savedName;
  }catch(e){}

  // Fonte e alinhamento do título
  const labelFont = document.getElementById('labelFont');
  const labelAlignBtn = document.getElementById('labelAlignBtn');
  let titleAlign = 'left';

  function applyTitleAlign(a){
    if(TITLE_ALIGN_STATES.indexOf(a) === -1) a = 'left';
    titleAlign = a;
    boardLabel.style.textAlign = a;
    labelAlignBtn.textContent = ALIGN_ICONS[a];
  }
  const TITLE_ALIGN_STATES = ['left', 'center', 'right'];

  labelFont.addEventListener('change', function(){
    boardLabel.style.fontFamily = labelFont.value;
    try{ localStorage.setItem('lousa-fonte', labelFont.value); }catch(e){}
  });
  labelAlignBtn.addEventListener('click', function(){
    const next = TITLE_ALIGN_STATES[(TITLE_ALIGN_STATES.indexOf(titleAlign) + 1) % TITLE_ALIGN_STATES.length];
    applyTitleAlign(next);
    try{ localStorage.setItem('lousa-alinhamento', next); }catch(e){}
  });

  try{
    const savedFont = localStorage.getItem('lousa-fonte');
    if(savedFont){
      boardLabel.style.fontFamily = savedFont;
      labelFont.value = savedFont;
    }
    const savedAlign = localStorage.getItem('lousa-alinhamento');
    if(savedAlign) applyTitleAlign(savedAlign);
    else applyTitleAlign('left');
  }catch(e){ applyTitleAlign('left'); }

  boardLabel.addEventListener('focus', function(){
    const range = document.createRange();
    range.selectNodeContents(boardLabel);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });
  boardLabel.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); boardLabel.blur(); }
    if(e.key === 'Escape'){ boardLabel.blur(); }
  });
  boardLabel.addEventListener('blur', function(){
    let name = boardLabel.textContent.replace(/\s+/g, ' ').trim();
    if(!name) name = 'lousa';
    boardLabel.textContent = name;
    try{ localStorage.setItem('lousa-nome', name); }catch(e){}
  });

  // Init
  setupCanvas(false);
  setTool('pen');
  syncAlignLabel();
  updateSizePreview();
  updateHistoryButtons();
  pushHistory();
})();
</script>

</body>
</html>
